name: claude-review
# Claude reviews every non-draft pull request and posts inline + summary comments.
# Needs: the Claude GitHub app installed on this repo (https://github.com/apps/claude)
# and the repo secret CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`).
# Based on anthropics/claude-code-action examples/pr-review-comprehensive.yml.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip drafts and PRs from forks (forks get no secrets).
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Claude PR review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Focus on what matters, in this order:
            1. Correctness bugs and edge cases
            2. Security (secrets, injection, auth, unsafe input handling)
            3. Data and query problems (wrong joins, slow or unbounded queries)
            4. Missing or weak tests for changed behaviour
            5. Unnecessary complexity or duplication

            Only report real, specific problems; skip style nitpicks and praise.
            Use inline comments for specific lines and one short top-level summary
            comment with a verdict (looks good / needs changes) and the key findings.
            If the repo has a CLAUDE.md, follow its conventions.
          # Opus at medium effort for every review ("opus" = latest Opus model).
          claude_args: |
            --model opus --effort medium
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
